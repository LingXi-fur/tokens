name: Bug report
description: Report a reproducible problem using sanitized or synthetic data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach real logs or dashboards. Remove usernames, paths, session IDs, prompts, credentials, and tokens.
  - type: input
    id: version
    attributes:
      label: tokens version
      description: Output from `tokens --version`.
      placeholder: "tokens 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real logs, dashboards, local paths, session IDs, prompts, and credentials.
          required: true

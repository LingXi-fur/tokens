name: Backfill PyPI package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag to backfill to PyPI
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Check out selected release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate release ref and package version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vX.Y.Z form: $INPUT_TAG" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "$INPUT_TAG" ]]; then
            echo "Run this workflow with Branch set to tag $INPUT_TAG" >&2
            exit 1
          fi

          tag_ref="refs/tags/$INPUT_TAG"
          git show-ref --verify --quiet "$tag_ref"
          tag_commit=$(git rev-list -n 1 "${tag_ref}^{commit}")
          checked_out_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$checked_out_commit"

          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${package_version}" = "$INPUT_TAG"

          release_tag=$(gh release view "$INPUT_TAG" --repo "$GH_REPO" --json tagName --jq .tagName)
          is_draft=$(gh release view "$INPUT_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)
          is_prerelease=$(gh release view "$INPUT_TAG" --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)
          test "$release_tag" = "$INPUT_TAG"
          test "$is_draft" = "false"
          test "$is_prerelease" = "false"

      - name: Install project
        run: python -m pip install -e .

      - name: Run release tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Build distributions
        run: |
          rm -rf dist
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Inspect release contents
        shell: bash
        run: |
          python - <<'PY'
          import re, tarfile, zipfile
          from pathlib import Path

          forbidden = ("/.claude/", "/out/", ".env")
          cache_file = re.compile(r"(?:^|/)records-v\d+\.json$")
          user_paths = re.compile(
              rb"/(?:private/)?Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+"
          )
          members = []
          sensitive = []
          for archive in Path("dist").iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as wheel:
                      members.extend(wheel.namelist())
                      sensitive.extend(
                          name for name in wheel.namelist()
                          if user_paths.search(wheel.read(name))
                      )
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive) as sdist:
                      members.extend(sdist.getnames())
                      sensitive.extend(
                          member.name for member in sdist.getmembers()
                          if member.isfile()
                          and user_paths.search(sdist.extractfile(member).read())
                      )
          bad = [
              name for name in members
              if any(item in "/" + name for item in forbidden)
              or cache_file.search(name)
          ]
          if bad:
              raise SystemExit("forbidden release files: " + ", ".join(bad))
          if sensitive:
              raise SystemExit("absolute user paths in release files: " + ", ".join(sensitive))
          PY

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/

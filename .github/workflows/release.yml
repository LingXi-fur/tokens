name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Run release tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Inspect release contents
        shell: bash
        run: |
          python - <<'PY'
          import re, tarfile, zipfile
          from pathlib import Path

          forbidden = ("/.claude/", "/out/", ".env", "records-v3.json")
          user_paths = re.compile(
              rb"/(?:private/)?Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+"
          )
          members = []
          sensitive = []
          for archive in Path("dist").iterdir():
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as wheel:
                      members.extend(wheel.namelist())
                      sensitive.extend(
                          name for name in wheel.namelist()
                          if user_paths.search(wheel.read(name))
                      )
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive) as sdist:
                      members.extend(sdist.getnames())
                      sensitive.extend(
                          member.name for member in sdist.getmembers()
                          if member.isfile()
                          and user_paths.search(sdist.extractfile(member).read())
                      )
          bad = [name for name in members if any(item in "/" + name for item in forbidden)]
          if bad:
              raise SystemExit("forbidden release files: " + ", ".join(bad))
          if sensitive:
              raise SystemExit("absolute user paths in release files: " + ", ".join(sensitive))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  draft-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            if [ "$is_draft" = "true" ]; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            else
              echo "Release $GITHUB_REF_NAME is already public; leaving it unchanged."
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --draft
          fi

  publish-pypi:
    needs: draft-github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ai-cli-tokens/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$is_draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            echo "Release $GITHUB_REF_NAME is already public."
          fi

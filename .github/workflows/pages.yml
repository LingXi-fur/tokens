name: Deploy documentation to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "scripts/build_docs_demo.py"
      - "src/tokens_cli/demo.py"
      - "src/tokens_cli/config.py"
      - "src/tokens_cli/opener.py"
      - "src/tokens_cli/dashboard_payload.py"
      - "src/tokens_cli/dashboard_wire.py"
      - "src/tokens_cli/report_dashboard.py"
      - "src/tokens_cli/dashboard_assets/**"
      - "tests/test_docs.py"
      - "tests/test_docs_demo.py"
      - "tests/test_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build public synthetic Dashboard
        run: python3 scripts/build_docs_demo.py
        env:
          PYTHONPATH: src
      - name: Run documentation tests
        run: python3 -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

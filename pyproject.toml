[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli-tokens"
version = "0.2.0"
description = "Private, local-first token analytics for Claude Code, Gemini CLI, and Codex."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tzdata>=2025.2; platform_system == 'Windows'",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LingXi-fur" }]
keywords = [
    "claude-code",
    "gemini-cli",
    "codex",
    "tokens",
    "usage-analytics",
    "dashboard",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/LingXi-fur/tokens"
Documentation = "https://lingxi-fur.github.io/tokens/"
Issues = "https://github.com/LingXi-fur/tokens/issues"
Source = "https://github.com/LingXi-fur/tokens"

[project.scripts]
tokens = "tokens_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokens_cli = ["dashboard_assets/*.html", "dashboard_assets/*.css", "dashboard_assets/*.js"]
